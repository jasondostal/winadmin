name: release

# Tag a version (e.g. v0.1.0) to cut a release: cross-platform binaries, an SBOM,
# and SHA256 checksums, all attached to the GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write    # keyless cosign signing via OIDC
  attestations: write # SLSA build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build all targets
        run: |
          mkdir -p dist
          targets="windows/amd64 linux/amd64 darwin/arm64 darwin/amd64"
          for t in $targets; do
            export GOOS=${t%/*} GOARCH=${t#*/}
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/fleet-${GOOS}-${GOARCH}${ext}"
            echo "building $out"
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/fleet
          done

      - name: Generate SBOM (CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod app -json -output dist/fleet.cyclonedx.json -main ./cmd/fleet

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/fleet-*'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fleet-*
            dist/fleet.cyclonedx.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
          generate_release_notes: true
